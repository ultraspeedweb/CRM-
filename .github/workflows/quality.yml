name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: dependencies
        run: npm ci
      - name: Audit deployable production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Audit entire dependency tree (including development tools)
        run: npm audit --audit-level=high
      - name: Run independent typecheck lint tests and build even if audit fails
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run verify

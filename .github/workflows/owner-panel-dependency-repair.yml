name: Owner panel dependency patch candidate
on:
  push:
    branches:
      - chore/owner-subdomain-closure-20261013
    paths:
      - .github/workflows/owner-panel-dependency-repair.yml
  pull_request:
    paths:
      - .github/workflows/owner-panel-dependency-repair.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Generate patched dependency lockfile without force
        run: |
          npm ci
          npm install --save-exact next@16.4.0
          npm install --save-dev --save-exact eslint-config-next@16.4.0
          npm audit fix --package-lock-only || true
          npm ls braces micromatch fast-glob @next/eslint-plugin-next || true
      - name: Verify reproducible install and exact candidate
        run: |
          npm ci
          npm run verify
      - name: Capture complete vulnerability inventory
        if: always()
        run: npm audit --json > security-audit.json || test "$?" -eq 1
      - name: Enforce FULL dependency security gate
        run: npm audit --audit-level=high
      - name: Upload candidate lockfile and audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-dependency-candidate
          path: |
            package.json
            package-lock.json
            security-audit.json
          retention-days: 7

name: Temporary isolated dependency remediation
on:
  push:
    branches:
      - fix/ws7-platform-csv-formula-guard-20261015
    paths:
      - .github/workflows/ws7-dependency-remediation.yml
permissions:
  contents: write
jobs:
  remediate:
    if: github.repository == 'ultraspeedweb/CRM-' && github.ref == 'refs/heads/fix/ws7-platform-csv-formula-guard-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Upgrade patched security dependencies without forcing
        run: |
          npm install --save-exact next@16.4.1 react@19.2.9 react-dom@19.2.9 eslint-config-next@16.4.1
          npm audit fix --package-lock-only || true
          npm ls next react react-dom sharp source-map-js
          npm audit --omit=dev --audit-level=high
      - name: Commit reviewed dependency files only to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "fix(deps): upgrade Next and React security patches"
          git push origin HEAD:refs/heads/fix/ws7-platform-csv-formula-guard-20261015

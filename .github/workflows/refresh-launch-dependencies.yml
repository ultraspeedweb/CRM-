name: Refresh launch dependencies

on:
  push:
    branches: ["launch/closure-20260924"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Upgrade patched Next.js and refresh lockfile
        run: npm install --save-exact next@16.3.6 eslint-config-next@16.3.6
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Canonical quality gate
        run: npm run verify
      - name: Commit verified dependency refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "Upgrade Next.js security patch [lock-refresh]"
          git push origin HEAD:${GITHUB_REF_NAME}
